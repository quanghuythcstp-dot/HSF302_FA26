<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Form tìm kiếm -->
    <form th:action="@{/students}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" name="keyword"
                   th:value="${keyword}"
                   placeholder="Tìm theo tên hoặc email..."/>
            <button type="submit" class="btn btn-outline-primary">
                <i class="bi bi-search me-1"></i>Tìm
            </button>
            <a th:href="@{/students}" class="btn btn-outline-secondary"
               th:if="${keyword != null and !#strings.isEmpty(keyword)}">
                <i class="bi bi-x-lg me-1"></i>Xóa lọc
            </a>
        </div>
        <small th:if="${keyword != null and !#strings.isEmpty(keyword)}"
               class="text-muted mt-1 d-block">
            Kết quả tìm kiếm cho: <strong th:text="${keyword}"></strong>
            (<span th:text="${#lists.size(students)}"></span> sinh viên)
        </small>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp rỗng -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Chưa có sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>
                        <a th:href="@{/students(sort='id', dir=${sortField == 'id'} ? ${reversDir} : 'asc', keyword=${keyword}, page=0, size=5)}"
                           class="text-white text-decoration-none">
                            ID
                            <i class="bi" th:classappend="${sortField == 'id'} ? (${sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/students(sort='name', dir=${sortField == 'name'} ? ${reversDir} : 'asc', keyword=${keyword}, page=0, size=5)}"
                           class="text-white text-decoration-none">
                            Họ tên
                            <i class="bi" th:classappend="${sortField == 'name'} ? (${sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <th>Email</th>
                    <th>
                        <a th:href="@{/students(sort='age', dir=${sortField == 'age'} ? ${reversDir} : 'asc', keyword=${keyword}, page=0, size=5)}"
                           class="text-white text-decoration-none">
                            Tuổi
                            <i class="bi" th:classappend="${sortField == 'age'} ? (${sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <th>Chuyên ngành</th>
                    <th>
                        <a th:href="@{/students(sort='gpa', dir=${sortField == 'gpa'} ? ${reversDir} : 'asc', keyword=${keyword}, page=0, size=5)}"
                           class="text-white text-decoration-none">
                            GPA
                            <i class="bi" th:classappend="${sortField == 'gpa'} ? (${sortDir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(students)}" class="text-muted mt-2">
        <small>Tổng: <strong th:text="${page.totalElements}">0</strong> sinh viên</small>
    </div>

    <!-- Thanh phân trang -->
    <nav th:if="${page.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <!-- Prev -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(page=${currentPage - 1}, size=5, keyword=${keyword}, sort=${sortField}, dir=${sortDir})}">
                    &laquo;
                </a>
            </li>
            <!-- Số trang -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/students(page=${i}, size=5, keyword=${keyword}, sort=${sortField}, dir=${sortDir})}"
                   th:text="${i + 1}">1</a>
            </li>
            <!-- Next -->
            <li class="page-item" th:classappend="${currentPage == page.totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(page=${currentPage + 1}, size=5, keyword=${keyword}, sort=${sortField}, dir=${sortDir})}">
                    &raquo;
                </a>
            </li>
        </ul>
    </nav>

</section>
</body>
</html>
