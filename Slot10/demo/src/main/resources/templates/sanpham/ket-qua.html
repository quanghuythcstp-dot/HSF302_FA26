<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Kết quả</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="container py-4">

    <!-- Flash message: chỉ hiện ngay sau redirect, F5 sẽ biến mất -->
    <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${thongBao}">Thông báo</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="h5 mb-0">Danh sách sản phẩm</h3>
        <a th:href="@{/sanpham/them}" class="btn btn-primary btn-sm">+ Thêm tiếp</a>
    </div>

    <!-- Có dữ liệu → hiện danh sách -->
    <ul class="list-group mb-3" th:unless="${#lists.isEmpty(danhSach)}">
        <li class="list-group-item" th:each="sp : ${danhSach}">
            <!-- |...| literal substitution: ghép chuỗi gọn hơn dùng + -->
            <span th:text="|${sp.ten} — ${#numbers.formatDecimal(sp.gia, 1, 'POINT', 0, 'COMMA')} VNĐ (SL: ${sp.soLuong})|">
                Tên — Giá (SL)
            </span>
        </li>
    </ul>

    <!-- Rỗng → hiện thông báo -->
    <p th:if="${#lists.isEmpty(danhSach)}" class="text-muted">Chưa có sản phẩm.</p>

</main>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
