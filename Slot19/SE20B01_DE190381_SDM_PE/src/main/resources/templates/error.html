<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #1c2530; margin: 0; }
        .container { max-width: 750px; margin: 60px auto; padding: 0 16px; }
        .panel { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        h2 { margin-top: 0; color: #c0392b; }
        .alert { padding: 12px 16px; border-radius: 4px; background: #f8d7da; color: #7a1f27; border: 1px solid #eec2c6; }
        .btn { display: inline-block; margin-top: 20px; padding: 7px 16px; border: 1px solid #1a5276;
               border-radius: 4px; background: #2471a3; color: #fff; text-decoration: none; font-size: 14px; }
        .btn:hover { background: #1a5276; }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h2>Something went wrong</h2>
        <div class="alert" th:text="${errorMessage}">An unexpected error occurred.</div>
        <a th:href="@{/}" class="btn">Back to Home</a>
    </div>
</div>
</body>
</html>
