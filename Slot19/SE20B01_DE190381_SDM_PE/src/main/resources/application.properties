spring.application.name=SE20B01_DE190381_SDM_PE
server.port=8080
server.servlet.context-path=/

# MS SQL Server connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF302_2026_PE_SDM;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ddl-auto=none: Hibernate chi map entity vao bang co san, khong tu tao/sua bang
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
